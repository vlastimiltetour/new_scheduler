services:
  app:    
    environment:
      - APP_ENV=${APP_ENV}
      - DATABASE_URL=${DATABASE_URL}

  frontend:
    restart: always
    ports:
      - "5173:5173" 
    environment:
      # React (prohlížeč) bude posílat požadavky přímo na vaši veřejnou IP
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - app
      

      