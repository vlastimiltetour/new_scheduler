name: Test and Deploy Stack to Oracle OCI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1: Automated tests and linters
  # ==========================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      # --- 1. PYTHON TESTS ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov httpx

      - name: Run Python tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
        run: |
          python3 -m pytest app/

      # --- 2. REACT TESTS & LINT (ui directory) ---
    

  # ==========================================
  # JOB 2: Deployment to OCI
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to OCI server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/moje-aplikace || exit 1

            git pull origin main

            # Generate .env file from individual GitHub Secrets
            cat << 'EOF' > .env
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            EOF

            # Run with production compose file
            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml up --build -d

            docker image prune -f